[package]
name = "zeevum-protocol"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Wire protocol types for Zeevum messenger"
repository = "https://github.com/Zeevum/zeevum-protocol"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
sha2 = "0.11.0"
rand = "0.10.2"
tokio = { version = "1.53", default-features = false, features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1.53", default-features = false, features = ["rt", "macros"] }